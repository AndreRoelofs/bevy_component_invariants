name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Fork pull requests fire `pull_request`, which hands the job a read-only token
# and no access to secrets. Do not switch these jobs to `pull_request_target`:
# that would run a contributor's code with write access to this repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rustfmt:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No toolchain argument: rustup resolves the active toolchain, which is the
      # one rust-toolchain.toml pins, components included. `--allow-downgrade`
      # falls back to the most recent nightly that actually ships every pinned
      # component, so a nightly missing rustfmt or clippy is not a red CI.
      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --allow-downgrade
          rustup show active-toolchain

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the toolchain pinned by rust-toolchain.toml
        run: |
          rustup toolchain install --allow-downgrade
          rustup show active-toolchain

      # Fork pull requests cannot write to the cache, only read the one the
      # default branch populated — hence `save-if`, so PR branches never evict it.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: scripts/clippy.sh
